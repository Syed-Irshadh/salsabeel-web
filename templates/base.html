<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Salsabeel Academy{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <img src="/static/img/logo.jpeg" alt="Salsabeel Academy Logo">
            Salsabeel Academy
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/courses">Courses</a>
            <a href="/about">About Us</a>
            <a href="#" id="loginBtn" class="btn-gold">Sign Up / Login</a>
            <a href="#" id="logoutBtn" class="btn-gold" style="display: none;">Logout</a>
        </div>
    </nav>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2 class="text-center mb-2" style="color: var(--color-navy)">Welcome to Salsabeel</h2>
            <form id="authForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%">Sign In / Register</button>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    {% block content %}
    {% endblock %}

    <!-- Custom JS -->
    <script src="/static/js/main.js"></script>
</body>
</html>
